# .github/workflows/etl.yml
name: Weekly ETL

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday at 03:00 UTC
  workflow_dispatch:        # allow manual trigger
  push:
    branches: [master]
    paths:
      - "etl/**"
      - ".github/workflows/etl.yml"

permissions:
  contents: write
  actions: write   # to re-trigger the Deploy workflow after publishing data

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tippecanoe
        run: |
          sudo apt-get update -q
          sudo apt-get install -y tippecanoe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install Python deps
        working-directory: etl
        run: pip install -r requirements.txt

      - name: Run ETL
        working-directory: etl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py

      # New data is published — redeploy the web app so its cache-bust id
      # changes and visitors fetch the fresh tiles instead of stale cache.
      - name: Re-deploy web (refresh data cache)
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"master"}'
